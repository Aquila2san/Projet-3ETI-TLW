<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation</title>
</head>
<body>
    <h1>Réservation</h1>

    <h2>Votre destination :</h2>

    <select name="destination" id="destination" required>
            <option value="">-- Choisissez une destination --</option>
        </select><br><br>

    <form action="/panier.html" method="get">
        
        <h3>Informations du voyage :</h3>

        <label for="depart">Date de départ* :</label><br>
        <input type="date" name="depart" id="depart" required><br><br>

        <label for="retour">Date de retour* :</label><br>
        <input type="date" name="retour" id="retour" required><br><br>

        <label for="adultes">Nombre d'adultes* :</label><br>
        <input type="number" name="adultes" id="adultes" min="1" required><br><br>

        <label for="enfants">Nombre d'enfants (-12 ans)* :</label><br>
        <input type="number" name="enfants" id="enfants" min="0" required><br><br>

        <label for="breakfast">Petit-déjeuner ? :</label>
        <input type="checkbox" name="breakfast" id="breakfast"><br><br>

        <p>Prix estimé : <span>— €</span></p>

        <h3>Informations personnelles :</h3>

        <label for="nom">Nom :</label><br>
        <input type="text" name="nom" id="nom"><br><br>

        <label for="prénom">Prénom :</label><br>
        <input type="text" name="prénom" id="prénom"><br><br>

        <label for="email">Email :</label><br>
        <input type="email" name="email" id="email"><br><br>

        <input type="submit" value="Valider">
        <input type="reset" value="Réinitialiser">
    </form>
</body>
</html>
