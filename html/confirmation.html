<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touraud-Saunier/confirmation</title>
    <!--- GROUPE A Touraud-Saunier --->
    <link href="../styles/stylePrincipal.css" rel="stylesheet" />
    <link href="../styles/stylePaiement_Panier.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <img id="dest-image" src="" alt="">

    <h1>Confirmation de votre réservation</h1>
    <section class="recap">
        <div class="recap_box">
            <p>Merci pour votre commande ! Votre réservation a été enregistrée avec succès.</p>
            <p>Un e-mail de confirmation vous a été envoyé.</p>
            <p>Nous vous souhaitons un excellent voyage !</p>
        </div>
        <hr>

        <div class="recap_box">
            <h2>Récapitulatif de la réservation N° <span id="conf-id"></span></h2>

            <p>Client : <span id="conf-nom">...</span></p>
            <p>Email : <span id="conf-email">...</span></p>
            <hr>
            <div id="conf-liste-voyages">
                </div>

            <h3>Prix total réglé : <span class="prix" id="conf-total">... €</span></h3>
        </div>
        
        <div class="boutons">
            <form action="mainPage.html" method="get">
                <input type="submit" value="Retour à la page principale" class="bouton_confirmer">
            </form>
        </div>
        
    </section>

    <hr>

    <div id="footer-placeholder"></div>

    <script>
        $(function(){
            $("#header-placeholder").load("header.html");
            $("#footer-placeholder").load("footer.html");
        });
    </script>
    <script src="../js/confirmation.js"></script>
</body>
</html>
