<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touraud-Saunier/paiement</title>
    <!--- GROUPE A Touraud-Saunier --->
    <link href="../styles/stylePrincipal.css" rel="stylesheet" />
    <link href="../styles/stylePaiement_Panier.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <h1 class="page-title">Paiement et Confirmation de votre réservation</h1>

    <section class="recap">

        <h2>Résumé de votre commande</h2>
        <div class="recap_box">
            <div id="liste-panier-paiement"></div>

            <hr>
            
            <h3>Total à payer : <span class="prix" id="rec-total">0 €</span></h3>
        </div>
    <h2>Informations de paiement</h2>
        <div class="recap_box">
            <form action="confirmation.html" method="get">
                Nom du titulaire* :<br>
                <input type="text" id="titulaire" name="titulaire" required><br><br>

                Numéro de carte bancaire* :<br>
                <input type="text" id="numero" name="numero" maxlength="16" required><br><br>

                Date d'expiration* :<br>
                <input type="month" id="dateexp" name="dateexp" required><br><br>

                CVV* :<br>
                <input type="text" id="cvv" name="cvv" maxlength="3" required><br><br>

                Adresse e-mail* :<br>
                <input type="email" id="email" name="email" required><br><br>

                Adresse postale* :<br>
                <input type="text" id="adresse" name="adresse" required><br><br>

                <div class="boutons">
                    <input type="reset" value="Réinitialiser" class="bouton_modifier">
                    <input type="submit" value="Valider le paiement" class="bouton_confirmer">
                </div>
            </form>
        </div>
            
    </section>

    <hr>

    <div id="footer-placeholder"></div>

    <script>
        $(function(){
            $("#header-placeholder").load("header.html");
            $("#footer-placeholder").load("footer.html");
        });
    </script>
    <script src="../js/paiement.js"></script>
</body>
</html>
