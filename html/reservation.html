<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touraud-Saunier/reservation</title>
    <!--- GROUPE A Touraud-Saunier --->
    <link href="../styles/stylePrincipal.css" rel="stylesheet" />
    <link href="../styles/stylePaiement_Panier.css" rel="stylesheet" />
</head>
<body>
    <!--- Menu de Navigation --->
    <nav class="menu_nav">
        <div class="grid_col_pos2" id="barre_logo">
            <a href="mainPage.html">
                <img src="../imagesPartagees/logo.png" alt="logo travel'o" height="36" width="180">
            </a>
        </div>
        <div class="grid_col_pos3 grid_2col" id="barre_onglet">
            <a class="grid_col_pos1" href="panier.html"> 
                <img src="../imagesPartagees/panier.svg" alt="panier" height="36" width="36">
                Mon Panier
            </a>
        
            <a class="grid_col_pos2" href="profil.html"> 
                <img src="../imagesPartagees/profil.svg" alt="profil" height="36" width="36">
                Mon Profil
            </a>
        </div>
    </nav>

    <h1>Réservation</h1>

    <section class="recap">

        <div class="recap_box">
            <h2>Votre destination :</h2>

            <select name="destination" id="destination" required>
                    <option value="">-- Choisissez une destination --</option>
                </select><br><br>
        </div>
        
        <hr>

        <!-- Formulaire de réservation -->
        <div class="recap_box">
            <form action="panier.html" method="get">
                
                <h3>Informations du voyage :</h3>
                
                Date de départ* :<br>
                <input type="date" name="depart" id="depart" required><br><br>

                Date de retour* :<br>
                <input type="date" name="retour" id="retour" required><br><br>

                Nombre d'adultes* :<br>
                <input type="number" name="adultes" id="adultes" min="1" required><br><br>

                Nombre d'enfants (-12 ans)* :<br>
                <input type="number" name="enfants" id="enfants" min="0" required><br><br>

                Petit-déjeuner ? :
                <input type="checkbox" name="breakfast" id="breakfast"><br><br>
                
                <p>Prix estimé : <span>— €</span></p>
                <div class="boutons">
                    <input type="reset" value="Réinitialiser" class="bouton_modifier">
                    <input type="submit" value="Valider" class="bouton_confirmer">
                </div>
            </form>
        </div>
    </section>

    <hr>

    <footer>
        <nav class="menu_nav">
            <div class="grid_col_pos1">
                <a href="https://github.com/cpe-lyon/groupe-a-touraud-saunier">
                    <img src="../imagesPartagees/github-mark.svg" alt="github" height="36" width="36">
                    Notre GitHub
                </a>
            </div>
            <div class="grid_col_pos2">
                <a href="contacts.html"> 
                    <img src="../imagesPartagees/contacts.svg" alt="contacts" height="36" width="36">
                    Nous Contacter
                </a>
            </div>
        </nav>
    </footer>
</body>
</html>
