<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touraud-Saunier/reservation</title>
    <link href="../styles/stylePrincipal.css" rel="stylesheet" />
    <link href="../styles/stylePaiement_Panier.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <h1 class="page-title">Réservation</h1>

    <section class="recap">

        <div class="recap_box">
            <h2>Votre destination :</h2>

            <select name="destination" id="destination" required>
                <option value="">-- Chargement... --</option>
            </select>
        </div>
        
        <hr>

        <div class="recap_box">
            <form action="panier.html" method="get" id="formReservation">
                
                <h3>Informations du voyage :</h3>
                
                Date de départ* :<br>
                <input type="date" name="depart" id="depart" required><br><br>

                Date de retour* :<br>
                <input type="date" name="retour" id="retour" required><br><br>

                Nombre d'adultes* :<br>
                <input type="number" name="adultes" id="adultes" min="1" required><br><br>

                Nombre d'enfants (-12 ans)* :<br>
                <input type="number" name="enfants" id="enfants" min="0" required><br><br>

                Petit-déjeuner ? :
                <input type="checkbox" name="breakfast" id="breakfast"><br><br>
                
                <p>Prix estimé : <span id="prixTotal" class="prix">0</span> €</p>
                <div class="boutons">
                    <input type="reset" value="Réinitialiser" class="bouton_modifier">
                    <input type="submit" value="Valider" class="bouton_confirmer">
                </div>
            </form>
        </div>
    </section>

    <hr>

    <div id="footer-placeholder"></div>

    <script>
        $(function(){
            $("#header-placeholder").load("header.html");
            $("#footer-placeholder").load("footer.html");
        });
    </script>

    <script src="../js/reservation.js"></script>
</body>
</html>
