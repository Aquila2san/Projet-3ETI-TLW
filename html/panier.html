<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touraud-Saunier/panier</title>
    <!--- GROUPE A Touraud-Saunier --->
    <!--- STYLES --->
    <link href="../styles/stylePrincipal.css" rel="stylesheet" />
    <link href="../styles/stylePaiement_Panier.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <h1>Votre panier</h1>

    <section class="recap">

        <h2>Résumé de votre réservation</h2>

        <div class="recap_box" id="panier-vide" style="display:none;">
            <p>Votre panier est vide.</p>
        </div>

        <div class="recap_box" id="panier-plein">
            <p>Destination : <span id="panier-dest">—</span></p>
            <p>Date de départ : <span id="panier-depart">—</span></p>
            <p>Date de retour : <span id="panier-retour">—</span></p>
            <p>Adultes : <span id="panier-adultes">—</span></p>
            <p>Enfants : <span id="panier-enfants">—</span></p>
            <p>Petit-déjeuner : <span id="panier-dej">—</span></p>

            <h3>Total à payer : <span class="prix" id="panier-prix">— €</span></h3>
            
            <button id="bouton_supprimer">Vider le panier</button>
        </div>

        <div class="boutons">
            <form action="reservation.html" method="get">
                <input type="submit" value="Modifier la réservation" class="bouton_modifier">
            </form>

            <form action="paiement.html" method="get">
                <input type="submit" value="Confirmer la réservation" class="bouton_confirmer">
            </form>
        </div>

    </section>

    <hr>

    <div id="footer-placeholder"></div>

    <script>
        $(function(){
            $("#header-placeholder").load("header.html");
            $("#footer-placeholder").load("footer.html");
        });
    </script>

    <script src="../js/panier.js"></script>
</body>
</html>
