<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touraud-Saunier/panier</title>
    <!--- GROUPE A Touraud-Saunier --->
    <!--- STYLES --->
    <link href="../styles/stylePrincipal.css" rel="stylesheet" />
    <link href="../styles/stylePaiement_Panier.css" rel="stylesheet" />

</head>

<body>

    <h1>Votre panier</h1>

    <section class="recap">

        <h2>Résumé de votre réservation</h2>

        <div class="recap_box">
            <p><strong>Destination :</strong> —</p>
            <p><strong>Date de départ :</strong> —</p>
            <p><strong>Date de retour :</strong> —</p>
            <p><strong>Adultes :</strong> —</p>
            <p><strong>Enfants :</strong> —</p>
            <p><strong>Petit-déjeuner :</strong> —</p>

            <h3>Total à payer : <span class="prix">— €</span></h3>
        </div>

        <div class="boutons">
            <form action="reservation.html" method="get">
                <input type="submit" value="Modifier la réservation" class="bouton_modifier">
            </form>

            <form action="paiement.html" method="get">
                <input type="submit" value="Confirmer la réservation" class="bouton_confirmer">
            </form>
        </div>

    </section>

</body>
</html>
