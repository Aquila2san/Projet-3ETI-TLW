<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touraud-Saunier/panier</title>
    <!--- GROUPE A Touraud-Saunier --->
    <!--- STYLES --->
    <link href="../styles/stylePrincipal.css" rel="stylesheet" />
    <link href="../styles/stylePaiement_Panier.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <h1>Votre panier</h1>

    <section class="recap">
        
        <div id="panier-vide" class="recap_box hidden">
            <p>Votre panier est malheureusement vide.</p>
            <br>
            <a href="mainPage.html" class="bouton_confirmer">
                Découvrir nos voyages
            </a>
        </div>

        <div id="liste-reservations"></div>

        <div id="panier-actions" class="hidden">
            <div class="recap_box" >
                <h2>Total de la commande : <span id="total-global" class="prix">0</span> €</h2>
            </div>

            <div class="boutons">
                <a href="mainPage.html" class="bouton_modifier">
                    Réserver un autre voyage
                </a>

                <form action="paiement.html" method="get">
                    <input type="submit" value="Valider et Payer" class="bouton_confirmer">
                </form>
            </div>
        </div>

    </section>

    <div id="footer-placeholder"></div>

    <script>
        $(function(){
            $("#header-placeholder").load("header.html");
            $("#footer-placeholder").load("footer.html");
        });
    </script>
    <script src="../js/panier.js"></script>
</body>
</html>
