<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touraud-Saunier/panier</title>
    <!--- GROUPE A Touraud-Saunier --->
    <!--- STYLES --->
    <link href="../styles/stylePrincipal.css" rel="stylesheet" />
    <link href="../styles/stylePaiement_Panier.css" rel="stylesheet" />

</head>

<body>
    <!--- Menu de Navigation --->
    <nav class="menu_nav">
        <div class="grid_col_pos2" id="barre_logo">
            <a href="mainPage.html">
                <img src="../imagesPartagees/logo.png" alt="logo travel'o" height="36" width="180">
            </a>
        </div>
        <div class="grid_col_pos3 grid_2col" id="barre_onglet">
            <a class="grid_col_pos1" href="panier.html"> 
                <img src="../imagesPartagees/panier.svg" alt="panier" height="36" width="36">
                Mon Panier
            </a>
        
            <a class="grid_col_pos2" href="profil.html"> 
                <img src="../imagesPartagees/profil.svg" alt="profil" height="36" width="36">
                Mon Profil
            </a>
        </div>
    </nav>

    <h1>Votre panier</h1>

    <section class="recap">

        <h2>Résumé de votre réservation</h2>

        <div class="recap_box">
            <p><strong>Destination :</strong> —</p>
            <p><strong>Date de départ :</strong> —</p>
            <p><strong>Date de retour :</strong> —</p>
            <p><strong>Adultes :</strong> —</p>
            <p><strong>Enfants :</strong> —</p>
            <p><strong>Petit-déjeuner :</strong> —</p>

            <h3>Total à payer : <span class="prix">— €</span></h3>
        </div>

        <div class="boutons">
            <form action="reservation.html" method="get">
                <input type="submit" value="Modifier la réservation" class="bouton_modifier">
            </form>

            <form action="paiement.html" method="get">
                <input type="submit" value="Confirmer la réservation" class="bouton_confirmer">
            </form>
        </div>

    </section>

    <footer>
        <nav class="menu_nav">
            <div class="grid_col_pos1">
                <a href="https://github.com/cpe-lyon/groupe-a-touraud-saunier">
                    <img src="../imagesPartagees/github-mark.svg" alt="github" height="36" width="36">
                    Notre GitHub
                </a>
            </div>
            <div class="grid_col_pos2">
                <a href="contacts.html"> 
                    <img src="../imagesPartagees/contacts.svg" alt="contacts" height="36" width="36">
                    Nous Contacter
                </a>
            </div>
        </nav>
    </footer>
</body>
</html>
